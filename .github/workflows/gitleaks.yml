name: gitleaks
# Manual only: the org-wide scan runs nightly on uk-vps (company-hq scripts/governance/vps/gitleaks-nightly.sh, company-hq#30).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks CLI, free)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
